# Installed only together with the optional private engine.
[Unit]
Wants=openmikrorout-fail2ban.service
After=openmikrorout-fail2ban.service

[Service]
# Main stop is not complete until the engine and its SQLite/socket state are drained.
ExecStopPost=/opt/openmikrorout/.venv/bin/python -m app.fail2ban_maintenance --stop --data-dir /var/lib/openmikrorout
