name: Verify OpenMikroRout

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  applications-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned nDPI 6 and test the production classifier
        run: docker build --file native/Dockerfile.build --target verification --build-arg OMR_SOURCE_COMMIT="$GITHUB_SHA" --tag openmikrorout-native:ci .
      - name: Verify first-packet metadata, priority, and failure recovery in disposable namespaces
        run: |
          docker run --rm --network none --privileged --memory 768m --cpus 2 \
            -e OMR_RUN_NATIVE_KERNEL_TESTS=1 openmikrorout-native:ci \
            python native/tests/test_kernel.py --binary /verified/app/native/bin/omr-app-supervisor \
            --backend-quarantine --json
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iptables iproute2 dnsmasq-base conntrack wireguard-tools iputils-ping traceroute ipset fail2ban python3-systemd lldpd nmap tcpdump
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          npm install --global pnpm@12.16.1
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Python quality and tests
        run: |
          .venv/bin/ruff format --check app tests scripts native
          .venv/bin/ruff check app tests scripts native
          .venv/bin/mypy app tests scripts
          .venv/bin/mypy native
          .venv/bin/pytest -q
          .venv/bin/python -m pip check
      - name: Isolated Linux network tests
        run: sudo env NAT_RUN_KERNEL_TESTS=1 .venv/bin/python -m pytest tests/test_kernel.py tests/test_links.py tests/test_networking.py tests/test_wireguard_kernel.py tests/test_system_lists_kernel.py tests/test_rule_security_kernel.py tests/test_fail2ban_kernel.py tests/test_fail2ban_attempts_kernel.py tests/test_discovery_kernel.py tests/test_routed_scan_kernel.py tests/test_packet_capture_kernel.py -q
      - name: Interface checks
        run: pnpm check
      - name: Build container and check isolated demo startup
        run: |
          docker build --tag openmikrorout:ci .
          docker run --rm -i --network none --cap-drop ALL --read-only --memory 256m --pids-limit 64 --tmpfs /data:rw,nosuid,nodev,noexec,size=32m --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m -e OMR_MODE=demo openmikrorout:ci python - < scripts/container_smoke.py
      - name: Check restricted Linux container and Fail2ban lifecycle
        run: |
          docker run --rm -i --network none --cap-drop ALL \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add NET_BIND_SERVICE \
            --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges:true \
            --read-only --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=700 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 \
            --tmpfs /run:rw,nosuid,nodev,noexec,size=1m,mode=755 \
            openmikrorout:ci python - < scripts/container_fail2ban_smoke.py
